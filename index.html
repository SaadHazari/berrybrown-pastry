<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6EFE4" />
    <title>Berry Brown · Homemade cakes by Chef Safa, Dubai</title>
    <meta
      name="description"
      content="Small-batch cakes and tarts, baked to order by Chef Safa in Dubai. Order online for chilled delivery or pickup, or design a custom celebration cake."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Berry Brown · Made with heart, not haste" />
    <meta property="og:description" content="Small-batch cakes baked to order in Dubai. Order online in a few taps." />
    <meta property="og:image" content="/images/chocolate-drip-cake.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,100;1,9..144,300..700,100&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/images/hero-poster.webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Bakery",
        "name": "Berry Brown",
        "slogan": "Made with heart, not haste",
        "image": "/images/chocolate-drip-cake.webp",
        "description": "Homemade cakes and tarts baked to order by Chef Safa in Dubai.",
        "address": { "@type": "PostalAddress", "addressLocality": "Dubai", "addressCountry": "AE" },
        "telephone": "+971501234567",
        "priceRange": "AED 95 – AED 1,850",
        "currenciesAccepted": "AED",
        "paymentAccepted": "Credit Card, Apple Pay, Cash",
        "founder": { "@type": "Person", "name": "Chef Safa", "jobTitle": "Pastry Chef & Founder" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Berry Brown needs JavaScript to take orders. Message us on WhatsApp: +971 50 123 4567</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
